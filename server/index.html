
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration & Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8f0fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        p {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            cursor: pointer;
        }

        #message {
            margin-top: 12px;
            color: #15803d;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Registration Form -->
        <form id="registerForm">
            <h2>Student Registration</h2>

            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >

            <input
                type="email"
                id="regEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="regPassword"
                placeholder="Password"
                required
                minlength="6"
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">Register</button>

            <p>
                Already have an account?
                <a id="showLogin">Login</a>
            </p>
        </form>

        <!-- Login Form -->
        <form id="loginForm" class="hidden">
            <h2>Student Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

            <p>
                Don't have an account?
                <a id="showRegister">Register</a>
            </p>
        </form>

        <p id="message"></p>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        // Show Login Form
        document.getElementById("showLogin").onclick = function () {
            registerForm.classList.add("hidden");
            loginForm.classList.remove("hidden");
            message.textContent = "";
        };

        // Show Registration Form
        document.getElementById("showRegister").onclick = function () {
            loginForm.classList.add("hidden");
            registerForm.classList.remove("hidden");
            message.textContent = "";
        };

        // Registration
        registerForm.onsubmit = function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match!";
                return;
            }

            const student = {
                name: name,
                email: email,
                password: password
            };

            localStorage.setItem("student", JSON.stringify(student));

            message.style.color = "green";
            message.textContent = "Registration successful!";

            registerForm.reset();
        };

        // Login
        loginForm.onsubmit = function (event) {
            event.preventDefault();

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            const savedStudent = localStorage.getItem("student");

            if (!savedStudent) {
                message.style.color = "red";
                message.textContent = "Please register first!";
                return;
            }

            const student = JSON.parse(savedStudent);

            if (
                email === student.email &&
                password === student.password
            ) {
                message.style.color = "green";
                message.textContent =
                    "Welcome, " + student.name + "! Login successful.";
            } else {
                message.style.color = "red";
                message.textContent = "Invalid email or password!";
            }

            loginForm.reset();
        };
    </script>

</body>
</html>
